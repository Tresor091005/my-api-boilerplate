services:
  # ============ Database Postgres 18 ============
  db:
    image: postgres:18-alpine
    container_name: lahatre_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
    ports:
      - "28420:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============ Redis 8 (sans password en dev) ============
  redis:
    image: redis:8-alpine
    container_name: lahatre_redis
    restart: unless-stopped
    command: [
      "redis-server",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "volatile-lru",
      "--tcp-backlog", "511",
      "--timeout", "300",
      "--loglevel", "warning"
    ]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============ Mailpit (Dev) ============
  mailpit:
    image: axllent/mailpit:latest
    container_name: lahatre_mailpit
    restart: unless-stopped
    ports:
      - "28419:8025"
    environment:
      MAILPIT_SMTP_BIND_ADDR: 0.0.0.0:1025
      MAILPIT_WEB_BIND_ADDR: 0.0.0.0:8025
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============ Application (Serveur FrankenPHP mode normale) ============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: api.lahatre.com:latest
    container_name: lahatre_app
    restart: unless-stopped
    ports:
      - "28417:8080"
    environment: &laravel-env
      # FrankenPHP
      FRANKENPHP_CONFIG: ""
      SERVER_NAME: ":8080"
      PHP_OPCACHE_ENABLE: 0
      CADDY_SERVER_ROOT: "/var/www/html/public"
      SSL_MODE: "off"
      HEALTHCHECK_PATH: "/up"
      LOG_OUTPUT_LEVEL: "debug" 
      AUTORUN_ENABLED: "false"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'frankenphp run --config /etc/frankenphp/Caddyfile' | grep -v grep || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: api.lahatre.com:latest
    container_name: lahatre_reverb
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "reverb:start", "--port=6001"]
    stop_signal: SIGTERM
    environment:
      <<: *laravel-env
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "28418:6001"
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep reverb | grep -v grep || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    image: api.lahatre.com:latest
    container_name: lahatre_horizon
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    environment:
      <<: *laravel-env
    volumes:
      - .:/var/www/html 
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep horizon | grep -v grep || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: api.lahatre.com:latest
    container_name: lahatre_scheduler
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *laravel-env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'schedule:work' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dbdata:
