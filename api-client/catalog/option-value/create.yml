info:
  name: create
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/catalog/options/{{optionId}}/values?response=resource"
  body:
    type: json
    data: |-
      {
        "values": ["linen", "canvas"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body?.data?.[0]?.id;
        if (res.status >= 200 && res.status < 300 && typeof id === "string") {
          bru.setEnvVar("optionValueId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
