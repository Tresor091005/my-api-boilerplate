info:
  name: create
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/catalog/products?response=resource&include=variants"
  body:
    type: json
    data: |-
      {
        "name": "Everyday T-shirt",
        "variants": [
          {
            "unit_group_id": "{{unitGroupId}}",
            "tax_profile_id": null,
            "is_active": true,
            "options": [
              {
                "name": "color",
                "value": "white"
              }
            ]
          },
          {
            "unit_group_id": "{{unitGroupId}}",
            "tax_profile_id": null,
            "is_active": false,
            "options": [
              {
                "name": "color",
                "value": "navy"
              },
              {
                "name": "size",
                "value": "m"
              }
            ]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body?.data?.id;
        if (res.status >= 200 && res.status < 300 && typeof id === "string") {
          bru.setEnvVar("productId", id);
        }
        const variantId = res.body?.data?.variants?.[0]?.id;
        if (res.status >= 200 && res.status < 300 && typeof variantId === "string") {
          bru.setEnvVar("variantId", variantId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
