info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/catalog/categories?response=resource"
  body:
    type: json
    data: |-
      {
        "name": "Clothing",
        "is_active": true,
        "parent_id": null
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body?.data?.id;
        if (res.status >= 200 && res.status < 300 && typeof id === "string") {
          bru.setEnvVar("categoryId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
