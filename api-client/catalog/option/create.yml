info:
  name: create
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/catalog/options?response=resource&include=values"
  body:
    type: json
    data: |-
      {
        "name": "demo finish",
        "values": ["matte", "gloss"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body?.data?.id;
        if (res.status >= 200 && res.status < 300 && typeof id === "string") {
          bru.setEnvVar("optionId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
