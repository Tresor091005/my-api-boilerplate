info:
  name: create
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/catalog/products/{{productId}}/variants?response=resource"
  body:
    type: json
    data: |-
      {
        "variants": [
          {
            "unit_group_id": "{{unitGroupId}}",
            "is_active": true,
            "inventory": { "stock_tracking_enabled": true, "is_expirable": false, "deduction_strategy": "fifo" },
            "options": [
              {
                "name": "color",
                "value": "forest"
              },
              {
                "name": "size",
                "value": "m"
              }
            ]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body?.data?.[0]?.id;
        if (res.status >= 200 && res.status < 300 && typeof id === "string") {
          bru.setEnvVar("variantId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
