  body:
    type: json
    data: |-
      {
        "inventory": { "stock_tracking_enabled": false },
        "is_active": true,
        "options": [
          {
            "name": "color",
            "value": "green"
          },
          {
            "name": "size",
            "value": "l"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
