info:
  name: upsert
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/master/units/upsert?response=resource"
  body:
    type: json
    data: |-
      {
          "group_name": "Demo counting units",
          "units": [
              {
                  "name": "Demo piece",
                  "symbol": null,
                  "ratio": 1
              }
          ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body?.data?.id;
        if (res.status >= 200 && res.status < 300 && typeof id === "string") {
          bru.setEnvVar("unitGroupId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
