info:
  name: accept-invitation-as-current-user
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/invitations/accept"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "token": "{{invitationToken}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
