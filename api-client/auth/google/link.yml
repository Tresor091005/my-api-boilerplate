info:
  name: link-google-after-email-otp
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/google-identities"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "challenge_id": "{{googleChallengeId}}",
        "credential": "{{googleCredential}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
