info:
  name: verify-google-credential
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/google-challenge-verifications"
  auth: none
  body:
    type: json
    data: |-
      {
        "challenge_id": "{{googleChallengeId}}",
        "credential": "{{googleCredential}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.body?.data?.access_token;
        if (res.status === 200 && typeof token === 'string' && token.length > 0) {
          bru.setEnvVar('authToken', token);
        }
        if (res.body?.status === 'email_verification_required') {
          bru.setEnvVar('registrationEmail', res.body.email);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
