info:
  name: reset-password
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "{{registrationEmail}}",
        "token": "{{passwordResetToken}}",
        "password": "new-password-123",
        "password_confirmation": "new-password-123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
