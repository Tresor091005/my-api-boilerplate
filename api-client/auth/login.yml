info:
  name: login
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{registrationEmail}}",
        "password": "password123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.body?.data?.access_token;
        if (res.status === 200 && typeof token === 'string' && token.length > 0) {
          bru.setEnvVar('authToken', token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
