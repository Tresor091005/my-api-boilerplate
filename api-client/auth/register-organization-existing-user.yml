info:
  name: register-organization-existing-user
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/organization-registrations"
  auth: none
  body:
    type: json
    data: |-
      {
        "email": "{{registrationEmail}}",
        "token": "{{organizationRegistrationToken}}",
        "organization": {
          "name": "Second Company",
          "currency_code": "XOF",
          "timezone": "Africa/Porto-Novo"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
