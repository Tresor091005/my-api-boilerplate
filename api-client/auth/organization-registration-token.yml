info:
  name: request-organization-registration-token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/organization-registration-tokens"
  auth: none
  body:
    type: json
    data: |-
      {
        "email": "{{registrationEmail}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
