info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/iam/invitations?response=resource&include=roles"
  body:
    type: json
    data: |-
      {
        "email": "{{invitationEmail}}",
        "role_ids": [
          "{{roleId}}"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar('invitationId', res.body.data.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
