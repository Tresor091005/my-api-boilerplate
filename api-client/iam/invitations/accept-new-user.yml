info:
  name: accept-new-user
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/v1/iam/invitations/accept"
  body:
    type: json
    data: |-
      {
        "email": "{{invitationEmail}}",
        "token": "{{invitationToken}}",
        "first_name": "Invited",
        "last_name": "User",
        "password": "password123",
        "password_confirmation": "password123"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
