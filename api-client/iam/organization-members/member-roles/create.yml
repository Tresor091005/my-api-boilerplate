  url: "{{baseUrl}}/v1/iam/organization-members/{{organizationMemberId}}/member-roles?response=resource"
  body:
    type: json
    data: |-
      {
        "role_ids": [
          "{{roleId}}"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
