info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/iam/roles?response=resource&include=permissions"
  body:
    type: json
    data: |-
      {
        "name": "Sales Manager",
        "description": "Manages sales",
        "is_active": true,
        "permission_ids": []
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body?.data?.id;
        if (res.status >= 200 && res.status < 300 && typeof id === "string") {
          bru.setEnvVar("roleId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
