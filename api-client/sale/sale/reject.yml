info:
  name: reject
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/v1/sale/sales/{{saleId}}/reject?response=resource"
  body:
    type: json
    data: |-
        {
          "reason": "The deposit is too low for this customer"
        }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const sale = res.body?.data;
        if (res.status >= 200 && res.status < 300 && sale && typeof sale.id === "string") {
          bru.setEnvVar("saleId", sale.id);
          if (Number.isInteger(sale.version)) {
            bru.setEnvVar("saleVersion", String(sale.version));
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
