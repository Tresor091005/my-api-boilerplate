info:
  name: show
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/sale/sales/{{saleId}}?include=lines,transitions"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const sale = res.body?.data;
        if (res.status >= 200 && res.status < 300 && sale && typeof sale.id === "string") {
          bru.setEnvVar("saleId", sale.id);
          if (Number.isInteger(sale.version)) {
            bru.setEnvVar("saleVersion", String(sale.version));
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
