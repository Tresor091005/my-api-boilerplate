info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/sale/sales/{{saleId}}/fulfillments?include=lines"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const fulfillment = res.body?.data;
        if (res.status >= 200 && res.status < 300 && fulfillment && typeof fulfillment.id === "string") {
          bru.setEnvVar("fulfillmentId", fulfillment.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
